<section
  class="section-shell"
  id="hero"
>
  <div
    class="section-card grid items-center gap-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:gap-10 xl:gap-16"
  >
    <div class="min-w-0 space-y-8 sm:space-y-10">
      <!-- Tags -->
      <div class="flex flex-wrap gap-3">
        <span
          class="inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium text-sky-700 shadow-sm"
        >
          Senior Software Engineer
        </span>
        <span
          class="inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium text-sky-700 shadow-sm"
        >
          Technical Leader
        </span>
        <span
          class="inline-flex items-center rounded-full px-3 py-1.5 text-xs font-medium text-sky-700 shadow-sm"
        >
          Full-Stack Creator
        </span>

        <span
          class="inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs font-medium text-sky-700 shadow-sm"
        >
          <i class="fa-solid fa-mug-saucer text-sky-600"></i>
          Coffee Enthusiast
        </span>
      </div>

      <!-- Heading -->
      <div class="space-y-4">
        <h1
          class="text-3xl font-semibold tracking-tight text-slate-900 sm:text-4xl"
        >
          Hello, I'm <span class="text-sky-600 font-bold">Catalin</span>
        </h1>
        <p class="text-base leading-relaxed text-slate-600 sm:text-lg">
          I like transforming
          <span class="text-sky-600">ideas</span> into
          <span class="text-sky-600">software</span> fellow engineers enjoy
          <i>maintaining</i>, people enjoy <i>using</i>, and computers can
          <i>run</i> for a long time <i class="fa-solid fa-lightbulb"></i> ideally without catching fire.
        </p>
      </div>

      <!-- Buttons -->
      <div class="flex flex-col items-stretch gap-4 sm:flex-row sm:flex-wrap sm:items-center">
        <!-- Unified Resume Actions -->
        <div
          class="inline-flex w-full items-center justify-center rounded-full border border-slate-300 bg-white text-sm font-semibold text-slate-700 shadow-sm overflow-hidden sm:w-auto"
        >
          <button
            type="button"
            id="view-resume-btn"
            class="flex min-w-0 flex-1 items-center justify-center gap-2 px-5 py-3 transition hover:bg-sky-50 hover:text-sky-600"
          >
            <i class="fa-solid fa-eye"></i> View Resume
          </button>
          <div class="w-px h-6 bg-slate-200"></div>
          <a
            class="flex items-center justify-center gap-2 px-5 py-3 transition hover:bg-sky-50 hover:text-sky-600"
            download
            href="{{ url_for('static', filename='docs/CV_CatalinBota_En_2026.pdf') }}"
          >
            <i class="fa-solid fa-download"></i>
          </a>
        </div>

        <!-- View Projects -->
        <a
          class="inline-flex w-full items-center justify-center gap-2 rounded-full bg-sky-600 px-6 py-3 text-sm font-semibold text-white shadow-md transition hover:bg-sky-500 hover:shadow-lg sm:w-auto"
          href="#projects"
        >
          <i class="fa-solid fa-folder-open"></i> View Projects
        </a>
      </div>
    </div>

    <div class="relative flex min-w-0 w-full flex-col items-center">
      <div
        class="relative mx-auto w-full overflow-hidden rounded-3xl border border-slate-100 bg-gradient-to-br from-white to-slate-50 p-4 shadow-lg shadow-sky-100/50 sm:p-6 lg:p-8"
      >
        <div
          class="absolute inset-0 -z-10 bg-gradient-to-tr from-sky-100 via-transparent to-transparent blur-3xl"
        ></div>
          <img
            alt="Laptop displaying source code in a bright workspace"
            class="collection-image mx-auto aspect-square"
            src="{{ url_for('static', filename='images/laptop.webp') }}"
            width="800"
            height="800"
            decoding="async"
            fetchpriority="high"
          />
      </div>

      <!-- Social links -->
      <div
        class="mt-8 flex flex-wrap justify-center lg:justify-end gap-5 text-xl text-slate-500"
      >
        <a
          aria-label="Blog"
          class="transition hover:text-sky-600"
          href="https://botacatalin.github.io/Blog/"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fa-solid fa-blog"></i
        ></a>
        <a
          aria-label="GitHub Profile"
          class="transition hover:text-sky-600"
          href="https://github.com/nodes-ro"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fa-brands fa-github"></i
        ></a>
        <a
          aria-label="Contact"
          class="transition hover:text-sky-600"
          href="#contact"
          ><i class="fa-solid fa-envelope-open"></i
        ></a>
        <a
          aria-label="LinkedIn Profile"
          class="transition hover:text-sky-600"
          href="https://www.linkedin.com/in/catalinbota/"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fa-brands fa-linkedin"></i
        ></a>
        <a
          aria-label="Facebook Profile"
          class="transition hover:text-sky-600"
          href="https://www.facebook.com/profile.php?id=61573676917525"
          target="_blank"
          rel="noopener noreferrer"
          ><i class="fa-brands fa-facebook"></i
        ></a>
      </div>
    </div>
  </div>

  <!-- Resume Modal -->
  <dialog
    id="resume-modal"
    class="w-[calc(100vw-1.5rem)] max-w-4xl rounded-2xl p-0 shadow-2xl backdrop:bg-slate-900/50 backdrop:backdrop-blur-sm sm:w-11/12"
  >
    <div class="relative bg-white rounded-2xl overflow-hidden animate-fadeIn">
      <!-- Object with Fallback -->
      <object
        data="{{ url_for('static', filename='docs/CV_CatalinBota_En_2026.pdf') }}"
        type="application/pdf"
        class="h-[70vh] w-full rounded-b-2xl sm:h-[80vh]"
      >
        <div class="p-6 text-center text-slate-600">
          <p class="text-base mb-2 font-semibold">
            Your browser cannot display the PDF file.
          </p>
          <p class="text-sm">
            You can
            <a
              href="{{ url_for('static', filename='docs/CV_CatalinBota_En_2026.pdf') }}"
              download
              class="text-sky-600 underline hover:text-sky-500"
              >download the resume here</a
            >.
          </p>
        </div>
      </object>

      <!-- Close Button (Bottom Right, High Contrast) -->
      <button
        type="button"
        id="close-resume-btn"
        class="absolute right-4 top-4 inline-flex items-center gap-2 rounded-full bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-md transition hover:bg-sky-500 hover:shadow-lg sm:right-6 sm:top-auto sm:bottom-6 sm:px-5 sm:py-3"
      >
        <i class="fa-solid fa-xmark text-lg"></i> Close
      </button>
    </div>
  </dialog>

  <!-- JS -->
  <script>
    const viewBtn = document.getElementById("view-resume-btn");
    const closeBtn = document.getElementById("close-resume-btn");
    const modal = document.getElementById("resume-modal");
    viewBtn.addEventListener("click", () => modal.showModal());
    closeBtn.addEventListener("click", () => modal.close());
  </script>

</section>
