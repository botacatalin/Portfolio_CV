<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}My Portfolio{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 5.5rem;
    }

    body {
      font-family: "Poppins", sans-serif;
      overflow-x: hidden;
    }

    img,
    picture,
    object {
      max-width: 100%;
    }

    .text-brand {
      @apply text-sky-600;
    }
    .bg-brand {
      @apply bg-sky-600;
    }
    .section-shell {
      @apply relative bg-gradient-to-b from-white to-sky-50/30 px-4 py-4 sm:px-8 sm:py-8 lg:px-12 lg:py-10;
    }
    .section-card {
      @apply mx-auto max-w-6xl rounded-3xl border border-slate-100 bg-white p-5 shadow-xl shadow-sky-100/40 sm:p-8 lg:p-10;
    }
    .section-heading {
      @apply pt-0;
    }
    .section-title {
      @apply pt-0;
    }
    .category-title {
      @apply pt-1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out;
    }

    @media (max-width: 639px) {
      .section-card {
        border-radius: 1.5rem;
      }
    }
  </style>


</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/60">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:py-4">
      <a class="text-2xl font-semibold tracking-tight text-slate-900" href="#hero">
        <span class="text-sky-600">Port</span><span class="font-bold">folio</span>
      </a>
      <button aria-controls="main-navigation" aria-expanded="false"
              class="flex h-10 w-10 items-center justify-center rounded-lg border border-slate-300 text-slate-700 lg:hidden"
              id="menu-toggle">
        <span class="sr-only">Toggle navigation</span>
        <i class="fa-solid fa-bars"></i>
      </button>
      <ul class="hidden items-center gap-6 text-l font-medium text-slate-700 lg:flex" id="main-navigation">
        <li><a class="transition hover:text-sky-600" href="#hero">Home</a></li>
        <li><a class="transition hover:text-sky-600" href="#about">About</a></li>
        <li><a class="transition hover:text-sky-600" href="#projects">Projects</a></li>
        <li><a class="transition hover:text-sky-600" href="#skills">Skills</a></li>
        <li><a class="transition hover:text-sky-600" href="#contact">Contact</a></li>
      </ul>
    </div>
    <div class="mx-auto max-w-6xl px-4 pb-4 lg:hidden">
      <ul class="hidden flex-col gap-3 rounded-2xl border border-slate-200 bg-white/90 p-4 text-sm font-medium text-slate-700" id="mobile-menu">
        <li><a class="block rounded-xl px-3 py-2 transition hover:bg-slate-100 hover:text-sky-600" href="#hero">Home</a></li>
        <li><a class="block rounded-xl px-3 py-2 transition hover:bg-slate-100 hover:text-sky-600" href="#about">About</a></li>
        <li><a class="block rounded-xl px-3 py-2 transition hover:bg-slate-100 hover:text-sky-600" href="#projects">Projects</a></li>
        <li><a class="block rounded-xl px-3 py-2 transition hover:bg-slate-100 hover:text-sky-600" href="#skills">Skills</a></li>
        <li><a class="block rounded-xl px-3 py-2 transition hover:bg-slate-100 hover:text-sky-600" href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="mx-auto max-w-6xl space-y-4 px-3 py-4 sm:space-y-8 sm:px-4 sm:py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 py-8 text-center text-sm text-slate-500">
    © 2025-2026 Catalin Bota. All rights reserved.
  </footer>

  <script>
    const menuToggle = document.getElementById('menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    if (menuToggle && mobileMenu) {
      menuToggle.addEventListener('click', () => {
        const isOpen = mobileMenu.classList.toggle('hidden');
        menuToggle.setAttribute('aria-expanded', !isOpen);
        menuToggle.innerHTML = isOpen ? '<i class="fa-solid fa-bars"></i>' : '<i class="fa-solid fa-xmark"></i>';
      });

      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          mobileMenu.classList.add('hidden');
          menuToggle.setAttribute('aria-expanded', false);
          menuToggle.innerHTML = '<i class="fa-solid fa-bars"></i>';
        });
      });
    }
  </script>
</body>
</html>
